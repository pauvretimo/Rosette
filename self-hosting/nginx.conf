# Static hosting for the self-hosted Firefox update manifest + signed .xpi files.
# application/x-xpinstall on .xpi matters for the "click this link to install" first-time flow
# (it's what makes Firefox show the install prompt) — Mozilla's docs don't require a specific
# Content-Type for the *automatic background update* fetch itself, but setting it correctly
# costs nothing and covers both cases.
types {
    application/x-xpinstall xpi;
    application/json json;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex off;

    location / {
        add_header Cache-Control "no-cache";
    }
}
