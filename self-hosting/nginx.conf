# Static hosting for the self-hosted update manifests + signed packages, both browsers.
# Content-Type matters for a direct "click this link to install" download (it's what makes the
# browser recognize and offer to install the file) — background auto-update fetches don't
# strictly require it per Mozilla's docs, but setting it correctly costs nothing and covers
# both cases either way.
types {
    application/x-xpinstall xpi;
    application/x-chrome-extension crx;
    application/json json;
    application/xml xml;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex off;

    location / {
        add_header Cache-Control "no-cache";
    }
}
